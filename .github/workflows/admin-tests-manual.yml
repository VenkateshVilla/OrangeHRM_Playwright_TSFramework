name: Admin Playwright Tests (Manual)

on:
  workflow_dispatch:

jobs:
  admin-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USERNAME_ENC: ${{ secrets.USERNAME_ENC }}
      PASSWORD: ${{ secrets.PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run admin tests
        run: npx playwright test tests/admin.spec.ts

      # --- ADDED: Upload Playwright HTML Report ---
      - name: Upload Playwright HTML Report
        if: always() # Forces this step to run even if the tests failed
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/ # Make sure this matches your playwright.config.ts output folder
          retention-days: 30

      # --- ADDED: Upload Allure Results ---
      - name: Upload Allure Results
        if: always() # Forces this step to run even if the tests failed
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/ # Make sure this matches your allure reporter configuration
          retention-days: 30
